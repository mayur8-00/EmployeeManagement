{% extends "employees/base.html" %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card">
      <div class="card-header bg-dark text-white">
        <h4 class="mb-0">{{ title }}</h4>
      </div>

      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}

          <div class="row">
            <!-- NAME -->

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold"> Employee Name </label>

              <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Enter employee name"
                value="{{ employee.name|default:'' }}"
                required
              />
            </div>

            <!-- EMAIL -->

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold"> Email </label>

              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter email"
                value="{{ employee.email|default:'' }}"
                required
              />
            </div>

            <!-- PHONE -->

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold"> Phone </label>

              <input
                type="text"
                name="phone"
                class="form-control"
                placeholder="Enter phone number"
                value="{{ employee.phone|default:'' }}"
                required
              />
            </div>

            <!-- GENDER -->

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold"> Gender </label>

              <select name="gender" class="form-select" required>
                <option value="">Select Gender</option>

                <option
                  value="Male"
                  {%
                  if
                  employee.gender=""
                  ="Male"
                  %}
                  selected
                  {%
                  endif
                  %}
                >
                  Male
                </option>

                <option
                  value="Female"
                  {%
                  if
                  employee.gender=""
                  ="Female"
                  %}
                  selected
                  {%
                  endif
                  %}
                >
                  Female
                </option>

                <option
                  value="Other"
                  {%
                  if
                  employee.gender=""
                  ="Other"
                  %}
                  selected
                  {%
                  endif
                  %}
                >
                  Other
                </option>
              </select>
            </div>

            <!-- DEPARTMENT -->

            <div class="col-md-6 mb-3">

    <label class="form-label fw-semibold">
        Department
    </label>

    <select
        name="department"
        class="form-select"
        required
    >

        <option value="">
            Select Department
        </option>

        {% for department in departments %}

            <option
                value="{{ department.id }}"
                {% if employee.department_id == department.id %}
                    selected
                {% endif %}
            >
                {{ department.name }}
            </option>

        {% endfor %}

    </select>

</div>
            <!-- POSITION -->

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold"> Position </label>

              <input
                type="text"
                name="position"
                class="form-control"
                placeholder="Example: Python Developer"
                value="{{ employee.position|default:'' }}"
                required
              />
            </div>

            <!-- SALARY -->

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold"> Salary </label>

              <input
                type="number"
                step="0.01"
                name="salary"
                class="form-control"
                placeholder="Enter salary"
                value="{{ employee.salary|default:'' }}"
                required
              />
            </div>

            <!-- JOINING DATE -->

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold"> Joining Date </label>

              <input
                type="date"
                name="joining_date"
                class="form-control"
                {%
                if
                employee.joining_date
                %}
                value="{{ employee.joining_date|date:'Y-m-d' }}"
                {%
                endif
                %}
                required
              />
            </div>

            <!-- ADDRESS -->

            <div class="col-md-12 mb-3">
              <label class="form-label fw-semibold"> Address </label>

              <textarea
                name="address"
                class="form-control"
                rows="4"
                placeholder="Enter employee address"
                required
              >
{{ employee.address|default:'' }}</textarea
              >
            </div>
          </div>

          <!-- BUTTONS -->

          <div class="mt-3">
            <button type="submit" class="btn btn-success">
              {{ button_text }}
            </button>

            <a href="{% url 'employee_list' %}" class="btn btn-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
